<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quiz Premium</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main-menu" class="container">
        <h2 id="main-title">English Quiz Premium</h2>
        <p id="subtitle">Pon a prueba tu nivel</p>
        <p id="author">por: Adrián Fernández Aguirre</p>
        
        <svg id="ink-svg" width="90" height="90" viewBox="0 0 24 24" style="margin: 0 auto 15px auto; display: block;">
            <path fill="none" stroke="var(--color-primario)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v15H6.5a2.5 2.5 0 0 0-2.5 2.5z M10 6h6 M10 10h6 M10 14h3"/>
        </svg>
        
        <h3 id="topic-header">Introduce tu nombre</h3>
        
        <input type="text" id="player-name" placeholder="Tu nombre aquí..." autocomplete="off">
        <button id="start-game-btn" class="topic-btn" style="background-color: var(--color-primario); color: white;">Continuar</button>
        <button id="view-scores-btn" class="topic-btn" style="background-color: #6c757d; color: white; margin-top: 15px;">Ver Puntuaciones</button>
    </div>

    <div id="mode-menu" class="container hide">
        <h2 style="color: var(--color-primario); margin-bottom: 25px;">¿Qué quieres practicar?</h2>
        <button id="btn-vocab" class="topic-btn" style="background-color: #005a9c;">Vocabulario (Traducción)</button>
        <button id="btn-grammar" class="topic-btn" style="background-color: #a98f64;">Gramática (Ejercicios)</button>
        <button class="nav-btn menu-btn btn go-back-name" style="margin-top: 20px; width: 100%;">Volver Atrás</button>
    </div>

    <div id="grammar-menu" class="container hide">
        <h2 style="color: var(--color-africa-naranja); margin-bottom: 20px;">Bloques de Gramática</h2>
        <div style="max-height: 450px; overflow-y: auto; padding-right: 10px; margin-bottom: 15px;">
            <button class="topic-btn block-btn" data-block="1" style="padding: 15px; font-size: 1.1em;">Bloque 1: Future Simple</button>
            <button class="topic-btn block-btn" data-block="2" style="padding: 15px; font-size: 1.1em;">Bloque 2: Conditional Simple</button>
            <button class="topic-btn block-btn" data-block="3" style="padding: 15px; font-size: 1.1em;">Bloque 3: First Conditional</button>
            <button class="topic-btn block-btn" data-block="4" style="padding: 15px; font-size: 1.1em;">Bloque 4: Be going to</button>
            <button class="topic-btn block-btn" data-block="5" style="padding: 15px; font-size: 1.1em;">Bloque 5: There is / There are</button>
            <button class="topic-btn block-btn" data-block="6" style="padding: 15px; font-size: 1.1em;">Bloque 6: Will vs Be going to</button>
            
            <button class="topic-btn block-btn" data-block="7" style="padding: 15px; font-size: 1.1em;">Bloque 7: Present Simple vs. Cont.</button>
            <button class="topic-btn block-btn" data-block="8" style="padding: 15px; font-size: 1.1em;">Bloque 8: Past Simple</button>
            <button class="topic-btn block-btn" data-block="9" style="padding: 15px; font-size: 1.1em;">Bloque 9: Comparatives & Superlatives</button>
            <button class="topic-btn block-btn" data-block="10" style="padding: 15px; font-size: 1.1em;">Bloque 10: Modal Verbs</button>
            <button class="topic-btn block-btn" data-block="11" style="padding: 15px; font-size: 1.1em;">Bloque 11: Haz de Profesor (Errores)</button>
            
            <button class="topic-btn block-btn" data-block="all" style="background-color: var(--color-texto); color: white; padding: 15px; font-size: 1.1em;">Desafío Final: Mezclar Todo</button>
        </div>
        <button class="nav-btn menu-btn btn go-back-mode" style="margin-top: 10px; width: 100%;">Volver Atrás</button>
    </div>

    <div class="container hide" id="quiz-main">
        <div id="quiz-header">
            <h2 id="quiz-title">Jugando...</h2> 
        </div>
        
        <div id="question-container">
            <p id="category-text">Categoría</p>
            <p id="question-text">Aquí va la pregunta...</p>
        </div>
        
        <div class="stats-bar hide">
            <h3 id="score-text">Puntuación: 0 / 0</h3>
            <h3 id="errors-text">Errores: 0</h3>
        </div>
        
        <div id="answer-buttons" class="btn-grid"></div>

        <div id="input-zone" class="hide" style="text-align: center; margin-top: 20px;">
            <input type="text" id="grammar-input" placeholder="Escribe tu respuesta aquí..." autocomplete="off">
            <button id="check-btn" class="nav-btn" style="width: 100%; margin-top: 15px; padding: 15px; font-size: 1.2em;">Comprobar Respuesta</button>
        </div>

        <div id="feedback-box" class="hide">
            <p id="feedback-text"></p>
        </div>

        <div class="quiz-footer hide">
            <div class="controls">
                <button id="prev-btn" class="nav-btn btn invisible">Anterior</button>
                <button id="menu-btn" class="nav-btn menu-btn btn">Menú Principal</button>
                <button id="next-btn" class="nav-btn btn invisible">Siguiente</button>
            </div>
        </div>
        
        <div id="end-game-controls" class="hide">
             <div id="result-text"></div>
             <button id="restart-btn" class="nav-btn menu-btn btn">Volver al Menú</button>
        </div>
    </div>

    <div id="scoreboard-container" class="container hide">
        <h2 style="color: var(--color-primario); margin-bottom: 20px; font-weight: bold;">Registro de Puntuaciones</h2>
        <div id="scores-list"></div>
        <button id="close-scores-btn" class="nav-btn menu-btn btn" style="margin-top: 20px; width: 100%;">Volver al Menú</button>
        <button id="clear-scores-btn" class="nav-btn btn" style="background-color: var(--color-incorrecto); margin-top: 10px; width: 100%;">Borrar Historial de este ordenador</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
